<!DOCTYPE html>
<html lang="ko" data-theme="ink" data-size="3" data-lead="1" data-font="serif">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>점창여제 — 소설 (PC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/app.css"/>
<link rel="stylesheet" href="assets/css/novel.css"/>
<style>
  body.reader { display:flex; height:100vh; overflow:hidden; }

  aside { width:300px; flex:none; height:100vh; display:flex; flex-direction:column;
    background:var(--panel); border-right:1px solid var(--edge); }
  html[data-theme="sepia"] aside { background:#ece2d1; }
  html[data-theme="night"] aside { background:#0a0a0a; }

  .side-head { padding:18px 18px 14px; border-bottom:1px solid var(--edge); }
  .side-head a { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); }
  .side-head a:hover { color:var(--accent); }
  .side-head h1 { font-family:var(--serif); font-size:19px; color:var(--text); margin-top:10px; }
  .side-head p { margin:4px 0 0; font-size:11px; color:var(--text-dim); }

  .side-tabs { display:flex; border-bottom:1px solid var(--edge); }
  .side-tabs button { flex:1; padding:11px; font-size:12.5px; color:var(--text-dim);
    font-family:var(--sans); border-bottom:2px solid transparent; }
  .side-tabs button[aria-pressed="true"] { color:var(--accent); border-bottom-color:var(--accent); font-weight:700; }

  .side-body { flex:1; overflow-y:auto; padding:10px; }
  .side-body.hide { display:none; }

  /* 씬 목차 — 본문을 따라 현재 위치가 움직인다 */
  .toc a { display:block; padding:10px 12px; border-radius:8px; border-left:2px solid transparent;
    font-size:12px; color:var(--text-dim); line-height:1.6; font-family:var(--sans); }
  .toc a:hover { background:rgba(127,127,127,.09); }
  .toc a.on { border-left-color:var(--accent); color:var(--text); background:rgba(127,127,127,.08); }
  .toc a b { display:block; font-size:10.5px; color:var(--accent); margin-bottom:3px; letter-spacing:.08em; }
  .toc a span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  .side-foot { padding:12px 14px; border-top:1px solid var(--edge); display:flex; gap:8px; }
  .side-foot a { flex:1; text-align:center; padding:9px; border-radius:8px; border:1px solid var(--edge);
    font-size:12px; font-family:var(--sans); color:var(--text); }
  .side-foot a:hover { border-color:var(--accent); color:var(--accent); }
  .side-foot a.off { opacity:.3; pointer-events:none; }

  /* 본문 */
  .stage { flex:1; height:100vh; overflow-y:auto; position:relative; }
  .stage-in { max-width:46em; margin:0 auto; padding:74px 40px 120px; }

  .topright { position:fixed; top:16px; right:26px; z-index:40; display:flex; align-items:center; gap:10px; }
  .readout { font-family:var(--sans); font-size:12px; color:var(--text-dim);
    background:var(--paper); border:1px solid var(--edge); padding:7px 13px; border-radius:999px; }
  .gear { width:38px; height:38px; border-radius:10px; border:1px solid var(--edge);
    background:var(--paper); color:var(--text); font-family:var(--serif); font-weight:700; font-size:14px; }
  .pop { position:fixed; top:62px; right:26px; z-index:41; width:296px; padding:6px 18px 14px;
    background:var(--paper); border:1px solid var(--edge); border-radius:14px;
    box-shadow:0 16px 48px rgba(0,0,0,.4); display:none; }
  .pop.open { display:block; }

  .hint { position:fixed; left:50%; transform:translateX(-50%); bottom:22px; z-index:40;
    font-family:var(--sans); font-size:11.5px; color:var(--text-dim);
    background:var(--paper); border:1px solid var(--edge); padding:7px 15px; border-radius:999px;
    opacity:.85; transition:opacity .3s var(--ease); }
  .hint.gone { opacity:0; pointer-events:none; }

  @media (max-width:1024px) { aside { width:250px; } .stage-in { padding:64px 28px 100px; } }
  @media (max-width:820px) { aside { display:none; } }
</style>
</head>
<body class="reader">

<div class="progress"><i id="pg"></i></div>

<aside>
  <div class="side-head">
    <a href="index.html">← 점창여제 작품관</a>
    <h1 id="s-title"></h1>
    <p id="s-info"></p>
  </div>
  <div class="side-tabs">
    <button id="tab-ep" aria-pressed="true">회차</button>
    <button id="tab-toc" aria-pressed="false">이 화의 씬</button>
  </div>
  <div class="side-body scroll" id="body-ep"></div>
  <div class="side-body scroll toc hide" id="body-toc"></div>
  <div class="side-foot">
    <a id="s-prev">← 이전 화</a>
    <a id="s-next">다음 화 →</a>
  </div>
</aside>

<div class="stage scroll" id="stage">
  <div class="stage-in">
    <div class="opener">
      <div class="n" id="o-n"></div>
      <h1 id="o-title"></h1>
      <p class="hook" id="o-hook"></p>
      <div class="info" id="o-info"></div>
    </div>
    <article class="prose" id="prose"></article>
    <div class="ending" id="ending" hidden>
      <div class="done" id="e-done"></div>
      <div class="cut" id="e-cut"></div>
      <div class="acts">
        <a class="go" id="e-next">다음 화</a>
        <a class="go alt" id="e-webtoon">웹툰으로 보기</a>
        <a class="go alt" href="index.html">작품관</a>
      </div>
    </div>
  </div>
</div>

<div class="topright">
  <span class="readout" id="readout">0%</span>
  <button class="gear" id="gear" aria-label="읽기 설정">Aa</button>
</div>
<div class="pop" id="pop"></div>
<div class="hint" id="hint">← → 회차 &nbsp;·&nbsp; J K 씬 이동 &nbsp;·&nbsp; T 테마</div>

<script src="assets/js/series_data.js"></script>
<script src="assets/js/novel.js"></script>
<script src="assets/js/reader_ui.js"></script>
<script>
(() => {
  const ep = Series.epFromQuery();
  const meta = Series.get(ep);
  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const href = (n) => `novel_pc.html?ep=${n}`;

  Novel.apply(Novel.prefs());
  ReaderUI.settingsPanel($("pop"));

  document.title = `${meta.title} — 점창여제`;
  $("s-title").textContent = meta.title;
  $("s-info").textContent = `${Series.actLabel(ep)} · ${meta.chars.toLocaleString()}자 · 약 ${meta.minutes}분`;
  $("o-n").textContent = `${Series.work.part} · ${Series.actLabel(ep)} · 제${ep}화`;
  $("o-title").textContent = meta.title.replace(/^\d+화\s*—\s*/, "");
  if (meta.hook) $("o-hook").textContent = meta.hook; else $("o-hook").hidden = true;
  $("o-info").textContent = `${meta.chars.toLocaleString()}자 · 약 ${meta.minutes}분 · 씬 ${meta.scenes}`;

  ReaderUI.episodeList($("body-ep"), ep, href);
  $("s-prev").href = href(ep - 1); if (ep <= 1) $("s-prev").classList.add("off");
  $("s-next").href = href(ep + 1); if (ep >= Series.count()) $("s-next").classList.add("off");

  $("tab-ep").onclick = () => tab(true);
  $("tab-toc").onclick = () => tab(false);
  function tab(list) {
    $("tab-ep").setAttribute("aria-pressed", list);
    $("tab-toc").setAttribute("aria-pressed", !list);
    $("body-ep").classList.toggle("hide", !list);
    $("body-toc").classList.toggle("hide", list);
  }

  // 설정 팝오버는 바깥을 누르면 닫힌다
  $("gear").onclick = (e) => { e.stopPropagation(); $("pop").classList.toggle("open"); };
  document.addEventListener("click", (e) => {
    if (!$("pop").contains(e.target) && e.target !== $("gear")) $("pop").classList.remove("open");
  });

  let scenes = [];
  Novel.load(ep, (data) => {
    $("prose").innerHTML = Novel.render(data);
    $("ending").hidden = false;
    $("e-done").textContent = `${meta.title} 끝`;
    $("e-cut").textContent = meta.cutGrade
      ? `절단 ${meta.cutGrade}${meta.cutGradeLabel ? " · " + meta.cutGradeLabel : ""}`
      : "";
    ReaderUI.endLinks(meta, ep, href, "webtoon_pc.html", $("e-next"), $("e-webtoon"));

    scenes = [...$("prose").querySelectorAll(".scene")];
    $("body-toc").innerHTML = scenes.map((s, i) =>
      `<a href="#" data-i="${i}"><b>씬 ${i + 1}</b><span>${s.querySelector("p").textContent}</span></a>`).join("");
    $("body-toc").addEventListener("click", (e) => {
      const a = e.target.closest("a[data-i]");
      if (!a) return;
      e.preventDefault();
      goScene(Number(a.dataset.i));
    });

    start();
  }, () => {
    $("prose").innerHTML = '<p style="color:var(--text-dim)">본문을 불러오지 못했습니다. <code>tools/build_web.py</code> 를 실행했는지 확인하세요.</p>';
  });

  function goScene(i) {
    const s = scenes[Math.max(0, Math.min(i, scenes.length - 1))];
    if (s) stage.scrollTo({ top: s.offsetTop - 70, behavior: "smooth" });
  }

  function currentScene() {
    let cur = 0;
    scenes.forEach((s, i) => { if (s.offsetTop - 140 <= stage.scrollTop) cur = i; });
    return cur;
  }

  function start() {
    Novel.track(stage, ep, (r) => {
      $("pg").style.width = (r * 100).toFixed(1) + "%";
      const left = Math.max(0, Math.round(meta.minutes * (1 - r)));
      $("readout").textContent = `${Math.round(r * 100)}%` + (left ? ` · ${left}분 남음` : " · 끝");

      const cur = currentScene();
      $("body-toc").querySelectorAll("a").forEach((a, i) => a.classList.toggle("on", i === cur));
    });

    const saved = Novel.getPos(ep);
    if (saved > 0.04 && saved < 0.97) {
      $("hint").innerHTML = `읽던 곳 <b style="color:var(--accent)">${Math.round(saved * 100)}%</b> 에서 이어 읽기 — 클릭`;
      $("hint").style.cursor = "pointer";
      $("hint").onclick = () => { Novel.scrollTo(stage, saved); $("hint").classList.add("gone"); };
    }
    setTimeout(() => $("hint").classList.add("gone"), 9000);
  }

  ReaderUI.keys({
    prev: () => ep > 1 && (location.href = href(ep - 1)),
    next: () => ep < Series.count() && (location.href = href(ep + 1)),
    extra: (e) => {
      if (e.key === "j" || e.key === "J") { e.preventDefault(); goScene(currentScene() + 1); }
      if (e.key === "k" || e.key === "K") { e.preventDefault(); goScene(currentScene() - 1); }
    },
  });
})();
</script>
</body>
</html>
